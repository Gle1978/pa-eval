<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบประเมินผลสัมฤทธิ์ของงาน สายวิชาการ</title>
<style>body{margin:0;font:16px/1.6 Tahoma,sans-serif;background:#F5F1EE;color:#1E1814;display:grid;place-items:center;min-height:100vh;text-align:center;padding:16px}</style>
</head>
<body>
<p id="msg">กำลังเปิดระบบประเมินผลสัมฤทธิ์ของงาน…</p>
<script>
var API = "https://script.google.com/macros/s/AKfycbzd83zsJXkiuWtIsDc9184P4YOe2j4h9YkOw4xBda85uc88r4HySqw5PsDqi-2_RNj3/exec";
var KEY = "pa-app-html";
function show(h) {
  h = h.replace("<head>", "<head><title>ระบบประเมินผลสัมฤทธิ์ของงาน สายวิชาการ</title><script>window.API_URL=" + JSON.stringify(API) + ";<\/script>");
  document.open(); document.write(h); document.close();
}
function get(n) {
  return fetch(API + "?raw=1", {credentials: "omit", cache: "no-store"})
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .catch(function (e) {
      if (n > 0) return new Promise(function (ok) { setTimeout(ok, 2000); }).then(function () { return get(n - 1); });
      throw e;
    });
}
var cached = null;
try { cached = localStorage.getItem(KEY); } catch (e) {}
var fresh = get(3).then(function (h) { try { localStorage.setItem(KEY, h); } catch (e) {} return h; });
if (cached) show(cached);
else fresh.then(show).catch(function () { document.getElementById("msg").textContent = "เปิดระบบไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ต แล้วกดรีเฟรชหน้านี้อีกครั้ง"; });
</script>
</body>
</html>
